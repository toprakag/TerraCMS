cat > docker-compose.yml << 'EOF'
version: '3.8'
services:
  backend:
    build: ./server
    ports: ["8888:8888"]
    environment:
      - GIN_MODE=release
      - DB_HOST=db
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=terracms
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=terracms-secret-key-2024
    depends_on:
      - db
      - redis

  frontend:
    build: ./web
    ports: ["8080:80"]
    depends_on:
      - backend

  db:
    image: postgres:14
    environment:
      POSTGRES_DB: terracms
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    ports: ["6379:6379"]

volumes:
  postgres_data:
  redis_data:
EOF
