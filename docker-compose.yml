version: '3.8'
services:
  backend:
    build: ./server
    ports: ["8888:8888"]
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  frontend:
    build: ./web
    ports: ["8080:80"]
    depends_on:
      - backend

  db:
    image: postgres:14
    environment:
      POSTGRES_DB: terracms
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
